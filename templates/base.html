<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="AI-powered sales forecasting and business analytics">
    <title>{{ page_title }} | SalesPilot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <button class="mobile-menu-button" type="button" aria-label="Toggle navigation" aria-expanded="false" data-menu-toggle>
        <span></span><span></span><span></span>
    </button>
    <div class="app-shell">
        <aside class="sidebar" data-sidebar>
            <a class="brand" href="{{ url_for('home') }}">
                <span class="brand-mark">S</span>
                <span><strong>SalesPilot</strong><small>Business intelligence</small></span>
            </a>
            <p class="nav-label">Workspace</p>
            <nav class="main-nav" aria-label="Main navigation">
                {% for key, page in pages.items() %}
                <a class="nav-link {% if active_page == key %}active{% endif %}" href="{{ url_for(page.endpoint) }}">
                    <span class="nav-icon" data-icon="{{ page.icon }}"></span>
                    <span>{{ page.label }}</span>
                </a>
                {% endfor %}
            </nav>
            <div class="sidebar-footer">
                <div class="status-dot"></div>
                <div><strong>Day 1 foundation</strong><span>Workspace is ready</span></div>
            </div>
        </aside>
        <main class="main-content">
            <header class="topbar">
                <div class="breadcrumb"><span>Workspace</span><span class="breadcrumb-separator">/</span><strong>{{ page_title }}</strong></div>
                <div class="topbar-actions"><button class="icon-button" aria-label="Notifications" title="Notifications"><span class="bell-icon"></span></button><div class="avatar">JD</div></div>
            </header>
            <div class="content-wrap">{% block content %}{% endblock %}</div>
        </main>
    </div>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
